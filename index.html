<!DOCTYPE html>
<html lang="zh-TW">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Password Cracking Challenge</title>


    <style>

        /* =========================================
           全域設定
        ========================================= */

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background: #000000;

            color: #00ff66;

            font-family:
                "Courier New",
                "Microsoft JhengHei",
                monospace;

        }


        /* =========================================
           背景網格效果
        ========================================= */

        body::before {

            content: "";

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background-image:

                linear-gradient(
                    rgba(0, 255, 100, 0.04) 1px,
                    transparent 1px
                ),

                linear-gradient(
                    90deg,
                    rgba(0, 255, 100, 0.04) 1px,
                    transparent 1px
                );

            background-size: 40px 40px;

            pointer-events: none;

        }


        /* =========================================
           主面板
        ========================================= */

        .container {

            width: 450px;

            max-width: 90%;

            padding: 40px;

            background: #050505;

            border: 1px solid #00ff66;

            border-radius: 12px;

            text-align: center;

            box-shadow:

                0 0 10px
                rgba(0, 255, 100, 0.25),

                0 0 40px
                rgba(0, 255, 100, 0.08);

            position: relative;

            z-index: 1;

        }


        /* =========================================
           上方裝飾
        ========================================= */

        .top-line {

            color: #00aa44;

            font-size: 13px;

            margin-bottom: 25px;

            letter-spacing: 2px;

        }


        /* =========================================
           鎖頭
        ========================================= */

        .lock {

            font-size: 65px;

            margin-bottom: 10px;

            filter:

                drop-shadow(
                    0 0 10px
                    rgba(0, 255, 100, 0.7)
                );

        }


        /* =========================================
           秘密密碼觸發點 (鍵盤圖示)
        ========================================= */

        .secret-keyboard {

            cursor: default;

            user-select: none;

            display: inline-block;

            transition: transform 0.1s;

        }


        .secret-keyboard:active {

            transform: scale(0.9);

        }


        /* =========================================
           標題
        ========================================= */

        h1 {

            margin: 0;

            font-size: 28px;

            color: #00ff66;

            letter-spacing: 3px;

            text-shadow:

                0 0 8px
                rgba(0, 255, 100, 0.7);

        }


        .subtitle {

            margin-top: 10px;

            margin-bottom: 30px;

            color: #00aa44;

            font-size: 14px;

        }


        /* =========================================
           密碼輸入框
        ========================================= */

        .password-box {

            width: 100%;

            height: 65px;

            background: #000000;

            color: #00ff66;

            border: 2px solid #006633;

            border-radius: 8px;

            outline: none;

            text-align: center;

            font-family:
                "Courier New",
                monospace;

            font-size: 34px;

            font-weight: bold;

            letter-spacing: 15px;

            transition: 0.2s;

        }


        .password-box:focus {

            border-color: #00ff66;

            box-shadow:

                0 0 15px
                rgba(0, 255, 100, 0.25);

        }


        .password-box::placeholder {

            color: #164d2b;

            letter-spacing: 8px;

        }


        .password-box:disabled {

            opacity: 0.5;

            cursor: not-allowed;

        }


        /* =========================================
           按鈕
        ========================================= */

        button {

            width: 100%;

            height: 52px;

            margin-top: 15px;

            border-radius: 7px;

            font-family:
                "Courier New",
                monospace;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;

        }


        /* 確認按鈕 */

        .check-button {

            background: #00cc55;

            color: #000000;

            border: 1px solid #00ff66;

        }


        .check-button:hover {

            background: #00ff66;

            box-shadow:

                0 0 15px
                rgba(0, 255, 100, 0.5);

        }


        /* 重新開始 */

        .new-button {

            background: #111111;

            color: #00ff66;

            border: 1px solid #006633;

        }


        .new-button:hover {

            background: #0b2113;

            border-color: #00ff66;

        }


        /* =========================================
           密碼提示
        ========================================= */

        #passwordHint {

            min-height: 30px;

            margin-top: 18px;

            color: #ffff00;

            font-size: 17px;

            font-weight: bold;

            text-shadow:

                0 0 8px
                rgba(255, 255, 0, 0.5);

        }


        /* =========================================
           結果訊息
        ========================================= */

        #message {

            min-height: 50px;

            margin-top: 15px;

            display: flex;

            justify-content: center;

            align-items: center;

            font-size: 21px;

            font-weight: bold;

        }


        .success {

            color: #00ff66;

            text-shadow:

                0 0 10px
                rgba(0, 255, 100, 0.8);

        }


        .error {

            color: #ff3333;

            text-shadow:

                0 0 8px
                rgba(255, 0, 0, 0.5);

        }


        /* =========================================
           嘗試次數
        ========================================= */

        .attempts {

            margin-top: 10px;

            color: #777777;

            font-size: 15px;

        }


        .attempt-number {

            color: #00ff66;

            font-weight: bold;

        }


        /* =========================================
           底部提示
        ========================================= */

        .hint {

            margin-top: 25px;

            padding: 12px;

            border: 1px solid #15251a;

            background: #050a07;

            border-radius: 6px;

            color: #55705e;

            font-size: 13px;

            line-height: 1.7;

        }


        /* =========================================
           狀態列
        ========================================= */

        .status {

            margin-top: 20px;

            color: #008833;

            font-size: 12px;

            letter-spacing: 1px;

        }


        .status::before {

            content: "● ";

            color: #00ff66;

        }


        /* =========================================
           手機版
        ========================================= */

        @media (max-width: 500px) {

            .container {

                padding: 30px 20px;

            }


            h1 {

                font-size: 23px;

            }


            .lock {

                font-size: 55px;

            }


            .password-box {

                font-size: 28px;

                letter-spacing: 10px;

            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- =========================================
         頂端
    ========================================== -->

    <div class="top-line">

        SYSTEM // PASSWORD SECURITY

    </div>



    <!-- =========================================
         鎖頭
    ========================================== -->

    <div class="lock">

        🔐

    </div>





    <!-- =========================================
         標題
    ========================================== -->

    <h1>

        PASSWORD CRACKING

    </h1>


    <div class="subtitle">

        密碼破解挑戰

    </div>



    <!-- =========================================
         密碼輸入
    ========================================== -->

    <input

        type="text"

        id="passwordInput"

        class="password-box"

        maxlength="3"

        inputmode="numeric"

        autocomplete="off"

        placeholder="•••"

    >



    <!-- =========================================
         確認
    ========================================== -->

    <button

        class="check-button"

        onclick="checkPassword()">

        [ ENTER PASSWORD ]

    </button>



    <!-- =========================================
         重新開始
    ========================================== -->

    <button

        class="new-button"

        onclick="newPassword()">

        [ NEW PASSWORD ]

    </button>



    <!-- =========================================
         顯示密碼
    ========================================== -->

    <div id="passwordHint"></div>



    <!-- =========================================
         結果
    ========================================== -->

    <div id="message"></div>



    <!-- =========================================
         嘗試次數
    ========================================== -->

    <div class="attempts">

        ATTEMPTS :

        <span
            id="attemptCount"
            class="attempt-number">

            0

        </span>

    </div>



    <!-- =========================================
         教學提示
    ========================================== -->

    <div class="hint">

        <span class="secret-keyboard" onclick="showSecretPassword()">⌨️</span> 按 Enter 可以快速確認<br>

        🤖 使用 AutoHotkey 挑戰自動破解

    </div>



    <!-- =========================================
         系統狀態
    ========================================== -->

    <div class="status">

        SYSTEM READY

    </div>


</div>



<script>


    // ==================================================
    // 目前密碼
    // ==================================================

    let password = generatePassword();


    // ==================================================
    // 嘗試次數
    // ==================================================

    let attempts = 0;


    // ==================================================
    // 產生 100～999 的三位數密碼
    // ==================================================

    function generatePassword() {

        return Math.floor(
            Math.random() * 900
        ) + 100;

    }



    // ==================================================
    // 檢查密碼
    // ==================================================

    function checkPassword() {

        const input =
            document
                .getElementById("passwordInput")
                .value;


        const message =
            document
                .getElementById("message");


        // ==============================================
        // 嘗試次數 +1
        // ==============================================

        attempts++;


        document
            .getElementById("attemptCount")
            .textContent = attempts;



        // ==============================================
        // 檢查是否為三位數
        // ==============================================

        if (!/^\d{3}$/.test(input)) {

            message.textContent =
                "⚠ 請輸入 3 位數字";

            message.className =
                "error";

            return;

        }



        // ==============================================
        // 密碼正確
        // ==============================================

        if (Number(input) === password) {

            message.textContent =
                "🎉 恭喜你破解成功！";

            message.className =
                "success";


            // 鎖定輸入框

            document
                .getElementById("passwordInput")
                .disabled = true;


            // 顯示成功訊息

            document
                .getElementById("passwordHint")
                .textContent =
                "🔓 SECURITY BREACHED";


            // 跳轉至成功頁面

            setTimeout(function() {

                window.location.href =
                    "success.html?attempts="
                    + attempts;

            }, 1000);

        }



        // ==============================================
        // 密碼錯誤
        // ==============================================

        else {

            message.textContent =
                "✖ ACCESS DENIED";

            message.className =
                "error";

        }



        // ==============================================
        // 清除輸入
        // ==============================================

        document
            .getElementById("passwordInput")
            .value = "";


        // 游標回到輸入框

        if (
            !document
                .getElementById("passwordInput")
                .disabled
        ) {

            document
                .getElementById("passwordInput")
                .focus();

        }

    }



    // ==================================================
    // 點擊鍵盤圖示秘密查看密碼 (老師專用)
    // ==================================================

    let hintTimer = null;

    function showSecretPassword() {

        const hint =
            document
                .getElementById("passwordHint");


        hint.textContent =
            "🔑 PASSWORD = "
            + password;


        clearTimeout(hintTimer);


        // 3 秒後消失

        hintTimer = setTimeout(
            function() {

                hint.textContent = "";

            },
            3000
        );

    }


    // 保留相容性呼叫

    function showPassword() {

        showSecretPassword();

    }



    // ==================================================
    // 重新產生密碼
    // ==================================================

    function newPassword() {

        // 新密碼

        password =
            generatePassword();


        // 歸零

        attempts = 0;


        document
            .getElementById("attemptCount")
            .textContent = "0";


        // 清除訊息

        document
            .getElementById("message")
            .textContent = "";


        document
            .getElementById("message")
            .className = "";


        // 清除密碼提示與計時器

        clearTimeout(hintTimer);

        document
            .getElementById("passwordHint")
            .textContent = "";


        // 清除輸入

        const input =
            document
                .getElementById("passwordInput");


        input.value = "";


        // 重新啟用

        input.disabled = false;


        // 游標

        input.focus();

    }



    // ==================================================
    // Enter 鍵
    // ==================================================

    document
        .getElementById("passwordInput")
        .addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {

                    checkPassword();

                }

            }
        );



    // ==================================================
    // Ctrl + F6
    //
    // 老師查看答案
    // ==================================================

    document.addEventListener(
        "keydown",
        function(event) {

            if (
                event.ctrlKey &&
                event.key === "F6"
            ) {

                event.preventDefault();


                alert(
                    "🔑 正確密碼："
                    + password
                );

            }

        }
    );



    // ==================================================
    // 網頁載入
    // ==================================================

    window.onload = function() {

        document
            .getElementById("passwordInput")
            .focus();

    };


</script>


</body>

</html>
