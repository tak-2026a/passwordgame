```html
<!DOCTYPE html>
<html lang="zh-TW">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>密碼破解挑戰</title>


    <style>

        /* =================================
           基本設定
        ================================= */

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background: #f2f4f7;

            font-family:
                Arial,
                "Microsoft JhengHei",
                sans-serif;
        }


        /* =================================
           主容器
        ================================= */

        .container {

            width: 420px;

            max-width: 90%;

            background: white;

            padding: 40px;

            border-radius: 20px;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.12);

            text-align: center;
        }


        /* =================================
           小燈泡
        ================================= */

        .lightbulb {

            font-size: 55px;

            cursor: pointer;

            display: inline-block;

            margin-bottom: 10px;

            transition:
                transform 0.2s,
                filter 0.2s;

            user-select: none;
        }


        .lightbulb:hover {

            transform: scale(1.15);

            filter:
                drop-shadow(
                    0 0 10px
                    rgba(255, 193, 7, 0.8)
                );
        }


        .lightbulb:active {

            transform: scale(0.95);
        }


        /* =================================
           標題
        ================================= */

        h1 {

            margin: 0 0 10px 0;

            font-size: 30px;

            color: #222;
        }


        .description {

            color: #666;

            margin-bottom: 30px;

            font-size: 17px;
        }


        /* =================================
           密碼輸入框
        ================================= */

        .password-box {

            width: 100%;

            height: 60px;

            font-size: 32px;

            text-align: center;

            letter-spacing: 12px;

            border: 2px solid #ccc;

            border-radius: 10px;

            outline: none;

            transition:
                border-color 0.2s;
        }


        .password-box:focus {

            border-color: #4285f4;
        }


        /* =================================
           按鈕
        ================================= */

        button {

            width: 100%;

            height: 50px;

            margin-top: 15px;

            border: none;

            border-radius: 10px;

            font-size: 18px;

            cursor: pointer;

            transition: 0.2s;
        }


        .check-button {

            background: #4285f4;

            color: white;
        }


        .check-button:hover {

            background: #3367d6;
        }


        .new-button {

            background: #e9ecef;

            color: #333;
        }


        .new-button:hover {

            background: #dfe3e6;
        }


        /* =================================
           訊息
        ================================= */

        #message {

            min-height: 50px;

            margin-top: 20px;

            font-size: 22px;

            font-weight: bold;

            display: flex;

            justify-content: center;

            align-items: center;
        }


        .success {

            color: #198754;
        }


        .error {

            color: #dc3545;
        }


        /* =================================
           嘗試次數
        ================================= */

        .attempts {

            margin-top: 10px;

            color: #777;

            font-size: 16px;
        }


        /* =================================
           提示
        ================================= */

        .hint {

            margin-top: 25px;

            padding: 12px;

            background: #f8f9fa;

            border-radius: 8px;

            color: #777;

            font-size: 14px;

            line-height: 1.6;
        }


        /* =================================
           密碼顯示區
        ================================= */

        #passwordHint {

            min-height: 30px;

            margin-top: 15px;

            font-size: 18px;

            font-weight: bold;

            color: #f0ad00;
        }


        /* =================================
           手機版
        ================================= */

        @media (max-width: 500px) {

            .container {

                padding: 30px 20px;
            }

            h1 {

                font-size: 26px;
            }

            .lightbulb {

                font-size: 50px;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- =================================
         小燈泡
    ================================= -->

    <div
        class="lightbulb"
        onclick="showPassword()"
        title="點擊查看正確密碼">

        💡

    </div>



    <!-- =================================
         標題
    ================================= -->

    <h1>
        密碼破解挑戰
    </h1>


    <div class="description">

        請輸入 3 位數密碼

    </div>



    <!-- =================================
         密碼輸入
    ================================= -->

    <input

        type="text"

        id="passwordInput"

        class="password-box"

        maxlength="3"

        inputmode="numeric"

        autocomplete="off"

        placeholder="•••"

    >



    <!-- =================================
         確認密碼
    ================================= -->

    <button

        class="check-button"

        onclick="checkPassword()">

        確認密碼

    </button>



    <!-- =================================
         重新產生密碼
    ================================= -->

    <button

        class="new-button"

        onclick="newPassword()">

        重新產生密碼

    </button>



    <!-- =================================
         密碼提示
    ================================= -->

    <div id="passwordHint"></div>



    <!-- =================================
         結果訊息
    ================================= -->

    <div id="message"></div>



    <!-- =================================
         嘗試次數
    ================================= -->

    <div class="attempts">

        嘗試次數：
        <span id="attemptCount">0</span>

    </div>



    <!-- =================================
         AutoHotkey 提示
    ================================= -->

    <div class="hint">

        💡 AutoHotkey 練習<br>

        嘗試使用 AHK 自動輸入密碼。

    </div>


</div>



<script>


    // =============================================
    // 產生目前的密碼
    // =============================================

    let password = generatePassword();


    // =============================================
    // 嘗試次數
    // =============================================

    let attempts = 0;


    // =============================================
    // 產生三位數密碼
    // =============================================

    function generatePassword() {

        return Math.floor(
            Math.random() * 900
        ) + 100;

    }


    // =============================================
    // 檢查密碼
    // =============================================

    function checkPassword() {

        const input =
            document
                .getElementById("passwordInput")
                .value;


        const message =
            document
                .getElementById("message");


        // =========================================
        // 增加嘗試次數
        // =========================================

        attempts++;


        document
            .getElementById("attemptCount")
            .textContent = attempts;



        // =========================================
        // 檢查是不是三位數
        // =========================================

        if (!/^\d{3}$/.test(input)) {

            message.textContent =
                "請輸入 3 位數字";

            message.className =
                "error";

            return;

        }



        // =========================================
        // 密碼正確
        // =========================================

        if (Number(input) === password) {

            message.textContent =
                "🎉 恭喜你破解成功！";

            message.className =
                "success";


            // 密碼正確後停止輸入

            document
                .getElementById("passwordInput")
                .disabled = true;


            // 顯示成功提示

            document
                .getElementById("passwordHint")
                .textContent =
                "🔓 密碼已成功破解！";

        }



        // =========================================
        // 密碼錯誤
        // =========================================

        else {

            message.textContent =
                "❌ 密碼錯誤，請再試一次";

            message.className =
                "error";

        }



        // =========================================
        // 清空輸入框
        // =========================================

        document
            .getElementById("passwordInput")
            .value = "";


        // =========================================
        // 回到輸入框
        // =========================================

        if (
            !document
                .getElementById("passwordInput")
                .disabled
        ) {

            document
                .getElementById("passwordInput")
                .focus();

        }

    }



    // =============================================
    // 點擊小燈泡
    // 顯示正確密碼
    // =============================================

    function showPassword() {

        const hint =
            document
                .getElementById("passwordHint");


        hint.textContent =
            "💡 正確密碼是："
            + password;


        // 3 秒後自動隱藏

        setTimeout(function() {

            hint.textContent = "";

        }, 3000);

    }



    // =============================================
    // 重新產生密碼
    // =============================================

    function newPassword() {

        // 產生新的密碼

        password =
            generatePassword();


        // 嘗試次數歸零

        attempts = 0;


        document
            .getElementById("attemptCount")
            .textContent = "0";


        // 清除訊息

        document
            .getElementById("message")
            .textContent = "";


        document
            .getElementById("message")
            .className = "";


        // 清除密碼提示

        document
            .getElementById("passwordHint")
            .textContent = "";


        // 清除輸入

        const input =
            document
                .getElementById("passwordInput");


        input.value = "";


        // 重新啟用輸入框

        input.disabled = false;


        // 回到輸入框

        input.focus();

    }



    // =============================================
    // Enter 鍵送出
    // =============================================

    document
        .getElementById("passwordInput")
        .addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {

                    checkPassword();

                }

            }
        );



    // =============================================
    // Ctrl + F6
    // 老師查看正確答案
    // =============================================

    document.addEventListener(
        "keydown",
        function(event) {

            if (
                event.ctrlKey &&
                event.key === "F6"
            ) {

                event.preventDefault();

                alert(
                    "🔑 目前的正確密碼是："
                    + password
                );

            }

        }
    );



    // =============================================
    // 頁面載入完成
    // =============================================

    window.onload = function() {

        document
            .getElementById("passwordInput")
            .focus();

    };


</script>


</body>

</html>
```
