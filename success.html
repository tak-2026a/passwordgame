<!DOCTYPE html>
<html lang="zh-TW">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Crack Success - 跟著做！開合跳挑戰</title>


    <style>

        /* =========================================
           全域設定
        ========================================= */

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background: #000000;

            color: #00ff66;

            font-family:
                "Courier New",
                "Microsoft JhengHei",
                monospace;

            overflow-x: hidden;

            padding: 20px 0;

        }


        /* =========================================
           背景網格效果
        ========================================= */

        body::before {

            content: "";

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background-image:

                linear-gradient(
                    rgba(0, 255, 100, 0.04) 1px,
                    transparent 1px
                ),

                linear-gradient(
                    90deg,
                    rgba(0, 255, 100, 0.04) 1px,
                    transparent 1px
                );

            background-size: 40px 40px;

            pointer-events: none;

        }


        /* =========================================
           主面板
        ========================================= */

        .container {

            width: 480px;

            max-width: 92%;

            padding: 35px 30px;

            background: #050505;

            border: 2px solid #00ff66;

            border-radius: 12px;

            text-align: center;

            box-shadow:

                0 0 15px
                rgba(0, 255, 100, 0.35),

                0 0 50px
                rgba(0, 255, 100, 0.12);

            position: relative;

            z-index: 1;

        }


        /* =========================================
           頂部狀態
        ========================================= */

        .top-line {

            color: #00aa44;

            font-size: 13px;

            margin-bottom: 12px;

            letter-spacing: 2px;

        }


        .success-badge {

            display: inline-block;

            padding: 6px 16px;

            background: rgba(0, 255, 100, 0.15);

            border: 1px solid #00ff66;

            border-radius: 20px;

            color: #00ff66;

            font-size: 14px;

            font-weight: bold;

            letter-spacing: 1px;

            margin-bottom: 16px;

            text-shadow: 0 0 8px rgba(0, 255, 100, 0.8);

        }


        h1 {

            margin: 0;

            font-size: 26px;

            color: #00ff66;

            letter-spacing: 2px;

            text-shadow:

                0 0 10px
                rgba(0, 255, 100, 0.8);

        }


        .stats-info {

            margin-top: 8px;

            color: #00e5ff;

            font-size: 14px;

            min-height: 20px;

        }


        /* =========================================
           文字動畫：「跟著做！」
        ========================================= */

        .follow-box {

            margin: 22px 0 15px;

            padding: 16px 10px;

            background: rgba(0, 255, 100, 0.05);

            border: 1px dashed #00aa44;

            border-radius: 10px;

            position: relative;

            overflow: hidden;

        }


        .follow-box::before {

            content: "";

            position: absolute;

            top: -50%;

            left: -50%;

            width: 200%;

            height: 200%;

            background: radial-gradient(
                circle,
                rgba(0, 255, 100, 0.06) 0%,
                transparent 70%
            );

            animation: rotateBg 8s linear infinite;

            pointer-events: none;

        }


        @keyframes rotateBg {

            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }

        }


        .follow-title {

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 12px;

            font-size: 42px;

            font-weight: 900;

            letter-spacing: 6px;

            position: relative;

            z-index: 2;

        }


        /* 每個字的彈跳與發光動畫 */

        .animated-char {

            display: inline-block;

            animation: jumpChar 1.1s infinite ease-in-out;

            animation-delay: calc(var(--i) * 0.16s);

            text-shadow:

                0 0 12px rgba(0, 255, 100, 0.9),

                0 0 25px rgba(0, 255, 100, 0.5);

        }


        .animated-char:nth-child(1) {

            color: #00ff66;

        }


        .animated-char:nth-child(2) {

            color: #00e5ff;

            text-shadow:

                0 0 12px rgba(0, 229, 255, 0.9),

                0 0 25px rgba(0, 229, 255, 0.5);

        }


        .animated-char:nth-child(3) {

            color: #ffff00;

            text-shadow:

                0 0 12px rgba(255, 255, 0, 0.9),

                0 0 25px rgba(255, 255, 0, 0.5);

        }


        .animated-char.exclamation {

            color: #ff3366;

            text-shadow:

                0 0 12px rgba(255, 51, 102, 0.9),

                0 0 25px rgba(255, 51, 102, 0.5);

        }


        @keyframes jumpChar {

            0%, 100% {

                transform: translateY(0) scale(1);

            }

            45% {

                transform: translateY(-16px) scale(1.18) rotate(calc((var(--i) - 1.5) * 5deg));

            }

            60% {

                transform: translateY(2px) scale(0.96);

            }

        }


        .follow-subtitle {

            margin-top: 10px;

            color: #88cfa0;

            font-size: 14px;

            letter-spacing: 1px;

            position: relative;

            z-index: 2;

        }



        /* =========================================
           開合跳動畫舞台
        ========================================= */

        .stage {

            width: 100%;

            height: 250px;

            margin: 15px 0 10px;

            position: relative;

            display: flex;

            justify-content: center;

            align-items: center;

            background: #020804;

            border: 1px solid #14301d;

            border-radius: 10px;

            overflow: hidden;

        }


        /* 地面基線 */

        .stage-floor {

            position: absolute;

            bottom: 25px;

            width: 75%;

            height: 2px;

            background: linear-gradient(
                90deg,
                transparent,
                #00ff66,
                transparent
            );

            box-shadow: 0 0 10px #00ff66;

        }


        /* 地面影子 */

        .shadow {

            position: absolute;

            bottom: 22px;

            left: 50%;

            transform: translateX(-50%);

            width: 85px;

            height: 12px;

            background: radial-gradient(
                ellipse,
                rgba(0, 255, 100, 0.6) 0%,
                transparent 70%
            );

            border-radius: 50%;

            animation: shadowScale 1.1s infinite ease-in-out;

        }


        @keyframes shadowScale {

            0%, 100% {

                transform: translateX(-50%) scaleX(1);

                opacity: 0.8;

            }

            45%, 55% {

                transform: translateX(-50%) scaleX(0.5);

                opacity: 0.25;

            }

        }


        /* 鼓掌星光 */

        .clap-spark {

            position: absolute;

            top: 24px;

            left: 50%;

            transform: translateX(-50%);

            font-size: 26px;

            animation: clapFlash 1.1s infinite ease-in-out;

            pointer-events: none;

            z-index: 10;

        }


        @keyframes clapFlash {

            0%, 35% {

                opacity: 0;

                transform: translateX(-50%) scale(0.3);

            }

            45%, 55% {

                opacity: 1;

                transform: translateX(-50%) scale(1.3);

            }

            65%, 100% {

                opacity: 0;

                transform: translateX(-50%) scale(0.6);

            }

        }


        /* 開合跳人物本體 */

        .jumper {

            position: absolute;

            bottom: 30px;

            left: 50%;

            width: 140px;

            height: 190px;

            transform: translateX(-50%);

            animation: jumperJump 1.1s infinite ease-in-out;

        }


        /* 人物起跳與著地 */

        @keyframes jumperJump {

            0%, 100% {

                transform: translateX(-50%) translateY(0);

            }

            15% {

                transform: translateX(-50%) translateY(4px); /* 蹲踞蓄力 */

            }

            45%, 55% {

                transform: translateX(-50%) translateY(-38px); /* 跳躍最高點 */

            }

            85% {

                transform: translateX(-50%) translateY(2px); /* 緩衝著地 */

            }

        }


        /* 頭部 */

        .head {

            position: absolute;

            top: 15px;

            left: 50%;

            transform: translateX(-50%);

            width: 38px;

            height: 38px;

            border-radius: 50%;

            background: #00ff66;

            box-shadow:

                0 0 15px #00ff66,

                inset 0 0 8px #ffffff;

            z-index: 5;

        }


        /* 面罩 / 眼鏡 */

        .visor {

            position: absolute;

            top: 13px;

            left: 6px;

            width: 26px;

            height: 8px;

            background: #002211;

            border-radius: 4px;

            border: 1px solid #00ffff;

            box-shadow: 0 0 6px #00ffff;

        }


        /* 軀幹 */

        .torso {

            position: absolute;

            top: 55px;

            left: 50%;

            transform: translateX(-50%);

            width: 12px;

            height: 60px;

            background: #00ff66;

            border-radius: 6px;

            box-shadow:

                0 0 12px rgba(0, 255, 100, 0.7),

                inset 0 0 4px #ffffff;

            z-index: 4;

        }


        /* 軀幹能量燈 */

        .torso::after {

            content: "⚡";

            position: absolute;

            top: 14px;

            left: 50%;

            transform: translateX(-50%);

            font-size: 11px;

            color: #ffff00;

            text-shadow: 0 0 6px #ffff00;

        }


        /* 手臂共用樣式 */

        .arm {

            position: absolute;

            top: 58px;

            width: 10px;

            height: 68px;

            background: #00ff66;

            border-radius: 5px;

            box-shadow:

                0 0 10px rgba(0, 255, 100, 0.6),

                inset 0 0 4px #ffffff;

            transform-origin: top center;

            z-index: 3;

        }


        /* 左手臂 (面向我們的左側) */

        .arm.left {

            left: 65px;

            animation: leftArmMotion 1.1s infinite ease-in-out;

        }


        @keyframes leftArmMotion {

            0%, 100% {

                transform: rotate(18deg); /* 下垂合起 */

            }

            15% {

                transform: rotate(25deg);

            }

            45%, 55% {

                transform: rotate(155deg); /* 高舉拍手 */

            }

            85% {

                transform: rotate(22deg);

            }

        }


        /* 右手臂 (面向我們的右側) */

        .arm.right {

            right: 65px;

            animation: rightArmMotion 1.1s infinite ease-in-out;

        }


        @keyframes rightArmMotion {

            0%, 100% {

                transform: rotate(-18deg); /* 下垂合起 */

            }

            15% {

                transform: rotate(-25deg);

            }

            45%, 55% {

                transform: rotate(-155deg); /* 高舉拍手 */

            }

            85% {

                transform: rotate(-22deg);

            }

        }


        /* 腿部共用樣式 */

        .leg {

            position: absolute;

            top: 112px;

            width: 11px;

            height: 75px;

            background: #00ff66;

            border-radius: 5px;

            box-shadow:

                0 0 10px rgba(0, 255, 100, 0.6),

                inset 0 0 4px #ffffff;

            transform-origin: top center;

            z-index: 2;

        }


        /* 左腿 */

        .leg.left {

            left: 65px;

            animation: leftLegMotion 1.1s infinite ease-in-out;

        }


        @keyframes leftLegMotion {

            0%, 100% {

                transform: rotate(4deg); /* 併攏合起 */

            }

            15% {

                transform: rotate(6deg);

            }

            45%, 55% {

                transform: rotate(33deg); /* 張開跳躍 */

            }

            85% {

                transform: rotate(5deg);

            }

        }


        /* 右腿 */

        .leg.right {

            right: 65px;

            animation: rightLegMotion 1.1s infinite ease-in-out;

        }


        @keyframes rightLegMotion {

            0%, 100% {

                transform: rotate(-4deg); /* 併攏合起 */

            }

            15% {

                transform: rotate(-6deg);

            }

            45%, 55% {

                transform: rotate(-33deg); /* 張開跳躍 */

            }

            85% {

                transform: rotate(-5deg);

            }

        }



        /* =========================================
           節奏提示與計數面板
        ========================================= */

        .rhythm-bar {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-top: 14px;

            padding: 12px 18px;

            background: #09130c;

            border: 1px solid #1e4529;

            border-radius: 8px;

        }


        .rhythm-badge {

            font-size: 18px;

            font-weight: bold;

            letter-spacing: 2px;

            transition: color 0.15s;

        }


        .rep-count-box {

            font-size: 15px;

            color: #77aa88;

        }


        .rep-number {

            font-size: 22px;

            font-weight: bold;

            color: #ffff00;

            text-shadow: 0 0 8px rgba(255, 255, 0, 0.6);

        }



        /* =========================================
           按鈕區域
        ========================================= */

        .action-grid {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 12px;

            margin-top: 18px;

        }


        button {

            height: 48px;

            border-radius: 7px;

            font-family:
                "Courier New",
                "Microsoft JhengHei",
                monospace;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;

        }


        /* 返回挑戰按鈕 */

        .back-button {

            background: #00cc55;

            color: #000000;

            border: 1px solid #00ff66;

            grid-column: span 2;

        }


        .back-button:hover {

            background: #00ff66;

            box-shadow: 0 0 15px rgba(0, 255, 100, 0.6);

        }


        /* 控制按鈕 */

        .ctrl-button {

            background: #111111;

            color: #00ff66;

            border: 1px solid #006633;

        }


        .ctrl-button:hover {

            background: #0b2113;

            border-color: #00ff66;

        }



        /* =========================================
           底部狀態
        ========================================= */

        .footer-hint {

            margin-top: 20px;

            color: #486954;

            font-size: 12px;

            line-height: 1.6;

        }


        /* 手機版適配 */

        @media (max-width: 500px) {

            .container {

                padding: 25px 18px;

            }

            .follow-title {

                font-size: 34px;

                letter-spacing: 4px;

            }

            .stage {

                height: 230px;

            }

            .jumper {

                transform: translateX(-50%) scale(0.9);

            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- =========================================
         頂部
    ========================================== -->

    <div class="top-line">

        SYSTEM // SECURITY OVERRIDE ACCEPTED

    </div>


    <div class="success-badge">

        🔓 ACCESS GRANTED · CLEARANCE LEVEL 5

    </div>


    <h1>🎉 密碼破解成功！</h1>


    <div id="statsInfo" class="stats-info"></div>



    <!-- =========================================
         文字動畫：「跟著做！」
    ========================================== -->

    <div class="follow-box">

        <div class="follow-title">

            <span class="animated-char" style="--i:0">跟</span>

            <span class="animated-char" style="--i:1">著</span>

            <span class="animated-char" style="--i:2">做</span>

            <span class="animated-char exclamation" style="--i:3">！</span>

        </div>

        <div class="follow-subtitle">

            ⚡ 全體注意：站起來配合節奏進行開合跳 ⚡

        </div>

    </div>



    <!-- =========================================
         開合跳動畫舞台
    ========================================== -->

    <div class="stage" id="stageContainer">

        <!-- 頂部拍手火花 -->

        <div class="clap-spark">✨</div>


        <!-- 人物模型 -->

        <div class="jumper" id="jumper">

            <!-- 頭部與面罩 -->

            <div class="head">

                <div class="visor"></div>

            </div>


            <!-- 軀幹 -->

            <div class="torso"></div>


            <!-- 手臂 -->

            <div class="arm left"></div>

            <div class="arm right"></div>


            <!-- 腿部 -->

            <div class="leg left"></div>

            <div class="leg right"></div>

        </div>


        <!-- 地面陰影 -->

        <div class="shadow" id="shadow"></div>


        <!-- 地面網格線 -->

        <div class="stage-floor"></div>

    </div>



    <!-- =========================================
         節奏狀態與開合跳計數
    ========================================== -->

    <div class="rhythm-bar">

        <div id="rhythmText" class="rhythm-badge" style="color: #00ff66;">

            【 開 · JUMP 】

        </div>


        <div class="rep-count-box">

            已完成：<span id="repCount" class="rep-number">0</span> 下

        </div>

    </div>



    <!-- =========================================
         功能按鈕
    ========================================== -->

    <div class="action-grid">

        <button
            class="ctrl-button"
            id="soundBtn"
            onclick="toggleSound()">

            🔇 音效：關閉

        </button>


        <button
            class="ctrl-button"
            id="pauseBtn"
            onclick="togglePlay()">

            ⏸️ 暫停動作

        </button>


        <button
            class="back-button"
            onclick="goBack()">

            [ 🔁 重新挑戰密碼 (NEW CHALLENGE) ]

        </button>

    </div>



    <!-- =========================================
         底部提示
    ========================================== -->

    <div class="footer-hint">

        💡 運動有益健康 · 手臂充分伸展 · 雙腳開合跳躍<br>

        ⌨️ 點擊上方按鈕可返回密碼破解挑戰

    </div>


</div>



<script>

    // ==================================================
    // 讀取 URL 傳入的嘗試次數
    // ==================================================

    const urlParams = new URLSearchParams(window.location.search);

    const attempts = urlParams.get("attempts");

    const statsInfo = document.getElementById("statsInfo");


    if (attempts && Number(attempts) > 0) {

        statsInfo.textContent =
            `🏆 本次挑戰累計嘗試次數：${attempts} 次成功！`;

    } else {

        statsInfo.textContent =
            "🏆 恭喜成功破解系統密碼防護！";

    }



    // ==================================================
    // 開合跳計數與節奏文字聯動
    // 配合 CSS 1.1 秒動畫週期
    // ==================================================

    let repCount = 0;

    let isPlaying = true;

    let beatState = "open"; // "open" 或 "close"


    const rhythmText = document.getElementById("rhythmText");

    const repCountEl = document.getElementById("repCount");

    const jumper = document.getElementById("jumper");

    const shadow = document.getElementById("shadow");

    const pauseBtn = document.getElementById("pauseBtn");



    // 1.1 秒週期：每半週期約 550ms 切換開/合狀態

    const CYCLE_HALF = 550;


    let rhythmTimer = setInterval(updateRhythm, CYCLE_HALF);


    function updateRhythm() {

        if (!isPlaying) return;


        if (beatState === "open") {

            beatState = "close";

            rhythmText.textContent = "【 合 · LAND 】";

            rhythmText.style.color = "#00ff66";


            // 完成一次完整的開合跳

            repCount++;

            repCountEl.textContent = repCount;


            // 播放著地節奏音效

            playBeat(200, 0.12);

        } else {

            beatState = "open";

            rhythmText.textContent = "【 開 · JUMP 】";

            rhythmText.style.color = "#ffff00";


            // 播放起跳擊掌節奏音效

            playBeat(560, 0.15);

        }

    }



    // ==================================================
    // 暫停 / 播放切換
    // ==================================================

    function togglePlay() {

        isPlaying = !isPlaying;


        const animatedElements = document.querySelectorAll(
            ".jumper, .arm, .leg, .shadow, .clap-spark"
        );


        if (isPlaying) {

            animatedElements.forEach(el => {
                el.style.animationPlayState = "running";
            });

            pauseBtn.textContent = "⏸️ 暫停動作";

        } else {

            animatedElements.forEach(el => {
                el.style.animationPlayState = "paused";
            });

            pauseBtn.textContent = "▶️ 繼續動作";

        }

    }



    // ==================================================
    // Web Audio API 節奏音效合成器 (不需外部音檔)
    // ==================================================

    let audioCtx = null;

    let soundEnabled = false;

    const soundBtn = document.getElementById("soundBtn");


    function toggleSound() {

        soundEnabled = !soundEnabled;


        if (soundEnabled) {

            soundBtn.textContent = "🔊 音效：開啟";

            soundBtn.style.borderColor = "#00ff66";

            soundBtn.style.color = "#ffff00";


            if (!audioCtx) {

                audioCtx = new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

            }

            if (audioCtx.state === "suspended") {

                audioCtx.resume();

            }

            playBeat(440, 0.1);

        } else {

            soundBtn.textContent = "🔇 音效：關閉";

            soundBtn.style.borderColor = "#006633";

            soundBtn.style.color = "#00ff66";

        }

    }


    function playBeat(freq, duration) {

        if (!soundEnabled || !audioCtx) return;


        try {

            const osc = audioCtx.createOscillator();

            const gain = audioCtx.createGain();


            osc.type = "triangle";

            osc.frequency.setValueAtTime(
                freq,
                audioCtx.currentTime
            );


            gain.gain.setValueAtTime(
                0.15,
                audioCtx.currentTime
            );

            gain.gain.exponentialRampToValueAtTime(
                0.001,
                audioCtx.currentTime + duration
            );


            osc.connect(gain);

            gain.connect(audioCtx.destination);


            osc.start();

            osc.stop(audioCtx.currentTime + duration);

        } catch (e) {

            console.error(e);

        }

    }



    // ==================================================
    // 返回密碼遊戲
    // ==================================================

    function goBack() {

        window.location.href = "index.html";

    }

</script>


</body>

</html>
