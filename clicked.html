<!DOCTYPE html>
<html lang="zh-TW">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>點擊後可以修正密碼</title>


    <style>

        /* =========================================
           全域設定
        ========================================= */

        * {
            box-sizing: border-box;
            user-select: none;
        }


        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background: #000000;

            color: #00ff66;

            font-family:
                "Courier New",
                "Microsoft JhengHei",
                monospace;

            overflow-x: hidden;

            padding: 20px 0;

        }


        /* 背景科技網格 */

        body::before {

            content: "";

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background-image:

                linear-gradient(
                    rgba(0, 255, 100, 0.04) 1px,
                    transparent 1px
                ),

                linear-gradient(
                    90deg,
                    rgba(0, 255, 100, 0.04) 1px,
                    transparent 1px
                );

            background-size: 40px 40px;

            pointer-events: none;

        }


        /* 主容器 */

        .container {

            width: 520px;

            max-width: 92%;

            padding: 35px 30px;

            background: #050505;

            border: 2px solid #00ff66;

            border-radius: 14px;

            text-align: center;

            box-shadow:

                0 0 15px rgba(0, 255, 100, 0.35),

                0 0 50px rgba(0, 255, 100, 0.12);

            position: relative;

            z-index: 1;

        }


        /* 頂部狀態列 */

        .top-status {

            color: #00aa44;

            font-size: 13px;

            letter-spacing: 2px;

            margin-bottom: 8px;

        }


        h1 {

            margin: 5px 0 10px;

            font-size: 26px;

            letter-spacing: 2px;

            color: #00ff66;

            text-shadow: 0 0 10px rgba(0, 255, 100, 0.8);

        }


        /* 說明文字 */

        .desc-box {

            color: #00e5ff;

            font-size: 15px;

            font-weight: bold;

            margin-bottom: 16px;

            letter-spacing: 1px;

            text-shadow: 0 0 8px rgba(0, 229, 255, 0.6);

        }


        /* =========================================
           數據儀表板
        ========================================= */

        .dashboard {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 12px;

            margin: 16px 0;

        }


        .stat-card {

            background: #040d06;

            border: 1px solid #14381e;

            border-radius: 8px;

            padding: 14px 10px;

        }


        .stat-title {

            font-size: 12px;

            color: #00aa44;

            letter-spacing: 1px;

            margin-bottom: 6px;

        }


        .stat-value {

            font-size: 28px;

            font-weight: bold;

            color: #00ff66;

            text-shadow: 0 0 10px rgba(0, 255, 100, 0.7);

        }


        .stat-score {

            color: #ffff00;

            text-shadow: 0 0 10px rgba(255, 255, 0, 0.7);

        }


        /* =========================================
           進度條
        ========================================= */

        .progress-section {

            margin: 15px 0 18px;

        }


        .progress-header {

            display: flex;

            justify-content: space-between;

            font-size: 13px;

            color: #00aa44;

            margin-bottom: 6px;

        }


        .progress-bar-bg {

            width: 100%;

            height: 16px;

            background: #0d1f12;

            border: 1px solid #00ff66;

            border-radius: 8px;

            overflow: hidden;

            position: relative;

        }


        .progress-bar-fill {

            height: 100%;

            width: 0%;

            background: linear-gradient(
                90deg,
                #00ff66,
                #00e5ff,
                #ffff00
            );

            box-shadow: 0 0 10px rgba(0, 255, 100, 0.8);

            transition: width 0.08s ease-out;

        }


        /* =========================================
           千次鼓勵語彈出區
        ========================================= */

        .encouragement-box {

            min-height: 52px;

            margin: 14px 0;

            padding: 10px 14px;

            background: rgba(0, 255, 100, 0.06);

            border: 1px dashed #008833;

            border-radius: 8px;

            display: flex;

            justify-content: center;

            align-items: center;

            transition: all 0.3s;

        }


        .encouragement-text {

            font-size: 15px;

            font-weight: bold;

            color: #00e5ff;

            text-shadow: 0 0 8px rgba(0, 229, 255, 0.8);

            animation: pulseEncouragement 1.5s infinite alternate;

        }


        @keyframes pulseEncouragement {

            0% {
                transform: scale(0.98);
                opacity: 0.85;
            }

            100% {
                transform: scale(1.03);
                opacity: 1;
            }

        }


        /* =========================================
           超大點擊核心按鈕
        ========================================= */

        .click-area {

            position: relative;

            margin: 18px 0;

        }


        .click-button {

            width: 100%;

            height: 110px;

            background: radial-gradient(
                circle,
                #082410 0%,
                #020b04 100%
            );

            border: 2px solid #00ff66;

            border-radius: 12px;

            color: #00ff66;

            font-family:
                "Courier New",
                "Microsoft JhengHei",
                monospace;

            font-size: 24px;

            font-weight: 900;

            letter-spacing: 3px;

            cursor: pointer;

            box-shadow:

                0 0 20px rgba(0, 255, 100, 0.3),

                inset 0 0 15px rgba(0, 255, 100, 0.2);

            transition:

                transform 0.05s ease,

                box-shadow 0.05s ease,

                background 0.05s ease;

            display: flex;

            justify-content: center;

            align-items: center;

        }


        .click-button:hover {

            background: radial-gradient(
                circle,
                #0f3d1b 0%,
                #041407 100%
            );

            box-shadow:

                0 0 25px rgba(0, 255, 100, 0.5),

                inset 0 0 20px rgba(0, 255, 100, 0.3);

        }


        .click-button:active {

            transform: scale(0.97);

            background: radial-gradient(
                circle,
                #175927 0%,
                #082410 100%
            );

            box-shadow:

                0 0 35px rgba(0, 255, 100, 0.8),

                inset 0 0 25px rgba(0, 255, 100, 0.6);

        }


        /* 浮動得分文字 */

        .floating-score {

            position: absolute;

            font-size: 18px;

            font-weight: bold;

            color: #ffff00;

            text-shadow: 0 0 6px #ffff00;

            pointer-events: none;

            animation: floatUp 0.6s ease-out forwards;

            z-index: 10;

        }


        @keyframes floatUp {

            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }

            100% {
                opacity: 0;
                transform: translateY(-40px) scale(1.3);
            }

        }


        /* =========================================
           底部輔助列
        ========================================= */

        .footer-bar {

            margin-top: 15px;

            font-size: 13px;

            color: #496b53;

            line-height: 1.8;

        }


        .nav-link {

            display: inline-block;

            margin: 6px 10px 0;

            color: #008833;

            text-decoration: underline;

            cursor: pointer;

            font-size: 12px;

        }


        .nav-link:hover {

            color: #00ff66;

        }

    </style>

</head>


<body>


<div class="container">


    <!-- 頂端狀態 -->

    <div class="top-status">

        SYSTEM // PASSWORD OVERRIDE PROTOCOL

    </div>


    <h1>⚡ 點擊後可以修正密碼 ⚡</h1>


    <!-- 說明文字 -->

    <div class="desc-box">

        點擊下面核心累積能量，足夠時可以移除密碼

    </div>



    <!-- 數據儀表板 -->

    <div class="dashboard">

        <div class="stat-card">

            <div class="stat-title">已點擊次數</div>

            <div id="clickCount" class="stat-value">0</div>

        </div>


        <div class="stat-card">

            <div class="stat-title">獲得總分數</div>

            <div id="score" class="stat-value stat-score">0</div>

        </div>

    </div>



    <!-- 進度條 -->

    <div class="progress-section">

        <div class="progress-header">

            <span>核心充能進度：<span id="percentText">0%</span></span>

            <span>狀態：充能中...</span>

        </div>


        <div class="progress-bar-bg">

            <div id="progressBar" class="progress-bar-fill"></div>

        </div>

    </div>



    <!-- 千次鼓勵詞語區 -->

    <div class="encouragement-box" id="encouragementBox">

        <div id="encouragementText" class="encouragement-text">

            💡 點擊下方核心累積能量，足夠時可以移除密碼

        </div>

    </div>



    <!-- 超大點擊核心按鈕 -->

    <div class="click-area" id="clickArea">

        <button
            id="clickBtn"
            class="click-button"
            onclick="handleClick(event)">

            <span>💥 點擊核心累積能量</span>

        </button>

    </div>



    <!-- 底部說明 -->

    <div class="footer-bar">

        🎯 充能完成後系統將自動解除密碼鎖定並開放重設<br>

        <a href="index.html" class="nav-link">[ 返回密碼挑戰 ]</a>

        <span class="nav-link" onclick="resetCounter()">[ 重置計數歸零 ]</span>

    </div>


</div>



<script>

    // ==================================================
    // 遊戲狀態數據
    // ==================================================

    let clicks = 0;

    let score = 0;

    let isRedirecting = false;


    const clickCountEl = document.getElementById("clickCount");

    const scoreEl = document.getElementById("score");

    const progressBar = document.getElementById("progressBar");

    const percentText = document.getElementById("percentText");

    const encouragementText = document.getElementById("encouragementText");

    const clickArea = document.getElementById("clickArea");



    // ==================================================
    // 1000次專屬鼓勵詞語庫 (密碼覆寫/破解氛圍)
    // ==================================================

    const encouragements = [

        "🌟 突破 1,000 次！核心能量正在快速聚集！",

        "🔥 突破 2,000 次！密碼保護壁障開始削弱！",

        "⚡ 突破 3,000 次！重設電路已接通，持續充能！",

        "🚀 突破 4,000 次！安全防火牆正在被解析！",

        "💥 突破 5,000 次！已瓦解 25% 密碼鎖定協議！",

        "🏆 突破 6,000 次！核心充能穩定上升！",

        "🦾 突破 7,000 次！底層權限覆寫正在進行中！",

        "🌠 突破 8,000 次！能量穩定匯聚，請繼續加油！",

        "🔮 突破 9,000 次！密碼移除進程持續推進！",

        "👑 突破 10,000 次！能量已達 50%，即將成功！",

        "💫 突破 11,000 次！安全晶片保護機制正在鬆動！",

        "🎯 突破 12,000 次！覆寫信號正在傳輸中！",

        "⚔️ 突破 13,000 次！密碼防線即將崩解！",

        "🛡️ 突破 14,000 次！重設授權已獲取 70%！",

        "🌋 突破 15,000 次！能量正在逼近最高臨界點！",

        "🌈 突破 16,000 次！即將滿足密碼強制移除條件！",

        "🌪️ 突破 17,000 次！系統權限覆寫 85%！",

        "⚡ 突破 18,000 次！最後衝刺階段，即將解鎖！",

        "✨ 突破 19,000 次！密碼清除程序準備就緒！",

        "🔓 突破 20,000 次！能量達到 100%，正在移除密碼..."

    ];



    // ==================================================
    // 點擊事件處理
    // ==================================================

    let floatingCount = 0;


    function handleClick(e) {

        if (isRedirecting) return;


        clicks++;

        score++;


        // 即時更新數值

        clickCountEl.textContent = clicks.toLocaleString();

        scoreEl.textContent = score.toLocaleString();


        // 更新進度條 (偷偷在 20000 次滿載)

        const pct = Math.min(100, (clicks / 20000) * 100);

        progressBar.style.width = pct + "%";

        percentText.textContent = pct.toFixed(1) + "%";


        // 每點 1000 次給予一次鼓勵詞語

        if (clicks % 1000 === 0 && clicks > 0) {

            const index = Math.min(
                Math.floor(clicks / 1000) - 1,
                encouragements.length - 1
            );

            encouragementText.textContent = encouragements[index];

            encouragementText.style.color = "#ffff00";

            encouragementText.style.textShadow = "0 0 12px #ffff00";

        }


        // 浮動 +1 效果（限制同時最多 8 個以維持高頻點擊順暢）

        if (floatingCount < 8) {

            spawnFloatingText(e);

        }


        // 達到 20000 次時跳轉到 explode.html

        if (clicks >= 20000 && !isRedirecting) {

            isRedirecting = true;

            encouragementText.textContent =
                "🔓 能量已達 100%！正在執行密碼覆寫程序...";

            encouragementText.style.color = "#00ff66";


            setTimeout(() => {

                window.location.href = "explode.html";

            }, 250);

        }

    }



    // ==================================================
    // 浮動 +1 得分效果
    // ==================================================

    function spawnFloatingText(e) {

        floatingCount++;


        const span = document.createElement("span");

        span.className = "floating-score";

        span.textContent = "+1";


        const rect = clickArea.getBoundingClientRect();

        let x = rect.width / 2;

        let y = rect.height / 2;


        if (e && e.clientX && e.clientY) {

            x = e.clientX - rect.left;

            y = e.clientY - rect.top;

        } else {

            x += (Math.random() - 0.5) * 60;

            y += (Math.random() - 0.5) * 20;

        }


        span.style.left = x + "px";

        span.style.top = y + "px";


        clickArea.appendChild(span);


        setTimeout(() => {

            if (span.parentNode) {

                span.parentNode.removeChild(span);

            }

            floatingCount--;

        }, 600);

    }



    // ==================================================
    // 重置功能
    // ==================================================

    function resetCounter() {

        if (isRedirecting) return;


        clicks = 0;

        score = 0;

        clickCountEl.textContent = "0";

        scoreEl.textContent = "0";

        progressBar.style.width = "0%";

        percentText.textContent = "0%";

        encouragementText.textContent =
            "💡 點擊下方核心累積能量，足夠時可以移除密碼";

        encouragementText.style.color = "#00e5ff";

    }

</script>


</body>

</html>
